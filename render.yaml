# Render Blueprint: free web service running the Dockerfile (API + built web app).
# The database is external (e.g. Neon free Postgres): paste its connection string in DATABASE_URL.
# One-click: https://render.com/deploy?repo=https://github.com/leohamil31/SYNC-TECH
services:
  - type: web
    name: synctech
    runtime: docker
    plan: free
    region: virginia # same AWS region as Neon "US East (N. Virginia)": lowest latency to the database
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # asked on creation: Neon connection string
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true # random secret generated by Render
      - key: RUN_MIGRATIONS
        value: "true"
      # Seeds erase every table. Set to "true" for the first deploy only, then back to "false".
      - key: RUN_SEEDS
        value: "false"
