services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: courses
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d courses"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      PORT: 3333
      DATABASE_URL: postgres://postgres:postgres@db:5432/courses
      RUN_MIGRATIONS: "true"
      # Seeds truncate every table; set to "false" to keep data between restarts.
      RUN_SEEDS: ${RUN_SEEDS:-true}
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
